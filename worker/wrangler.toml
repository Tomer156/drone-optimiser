name = "droneoptimiser-db"
main = "src/index.js"
compatibility_date = "2026-08-08"

# The database. Rebuild and upload with `node tools/publish-db.mjs` from the repo root.
[[kv_namespaces]]
binding = "DB"
id = "a706e389eaca4cf3a5604b1b81c736ff"

# 300 requests per IP per minute. Raised at launch: the limit is per IP, and a mobile carrier or
# an office behind one address shares it between everyone on it. The limiter counts per Cloudflare location rather than globally,
# so a caller spread across colos gets 10 in each; it throttles a scraper, it does not gate access.
# `period` accepts only 10 or 60. `namespace_id` is a local label for this limiter, chosen here.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 300, period = 60 }
